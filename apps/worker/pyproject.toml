[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-agent-worker"
version = "0.1.0"
description = "FastAPI execution boundary for the GIS meteorology worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "gis-meteorology",
  "pydantic>=2.10.0",
  "uvicorn>=0.52.3",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.10.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
gis-meteorology = { path = "../../packages/gis-meteorology", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
