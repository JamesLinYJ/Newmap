name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install locked dependencies
        run: npm ci

      - name: Run TypeScript tests
        run: npm test

      - name: Validate release and governance contracts
        run: npm run test:release-pipeline

      - name: Check terminology
        if: matrix.node == 24
        run: npm run lint:terminology

      - name: Lint Desktop
        if: matrix.node == 24
        run: npm run lint:desktop

      - name: Build all applications
        if: matrix.node == 24
        run: npm run build

      - name: Check Desktop bundle budget
        if: matrix.node == 24
        run: npm run check:bundle

  python-worker:
    name: Python Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: '0.11.19'
          enable-cache: true
          cache-dependency-glob: apps/worker/uv.lock

      - name: Install locked Worker environment
        run: uv sync --project apps/worker --locked --extra test

      - name: Scan Worker security invariants
        run: uv run --project apps/worker --extra test python apps/worker/tests/scan_security.py

      - name: Run Worker and scientific tests
        run: uv run --project apps/worker --extra test python -m pytest apps/worker/tests tests -q
