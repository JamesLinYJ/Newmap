name: Apply observable repository governance once

on:
  push:
    branches:
      - codex/ui-system-cleanup-v0.1.5
    paths:
      - .github/workflows/apply-governance-observable-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v7
        with:
          ref: codex/ui-system-cleanup-v0.1.5
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate governance declaration
        run: node scripts/apply-repository-governance.mjs --dry-run

      - name: Apply governance and capture result
        id: governance
        continue-on-error: true
        env:
          REPOSITORY_ADMIN_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
        run: |
          set +e
          if [[ -z "${REPOSITORY_ADMIN_TOKEN}" ]]; then
            output='缺少 REPOSITORY_ADMIN_TOKEN 仓库 Secret。'
            status=1
          else
            output="$(node scripts/apply-repository-governance.mjs \
              --repository "${GITHUB_REPOSITORY}" 2>&1)"
            status=$?
          fi
          printf '%s\n' "${output}"
          {
            echo "status=${status}"
            echo 'details<<GOVERNANCE_OUTPUT'
            printf '%s\n' "${output}" | tail -n 40
            echo 'GOVERNANCE_OUTPUT'
          } >> "${GITHUB_OUTPUT}"
          exit "${status}"

      - name: Commit observable result marker
        if: always()
        env:
          STATUS: ${{ steps.governance.outputs.status }}
          OUTCOME: ${{ steps.governance.outcome }}
          DETAILS: ${{ steps.governance.outputs.details }}
        run: |
          node <<'NODE'
          import { writeFileSync } from 'node:fs'
          const result = {
            generatedAt: new Date().toISOString(),
            success: process.env.OUTCOME === 'success',
            status: Number(process.env.STATUS || 1),
            details: process.env.DETAILS || '未生成执行详情。',
          }
          writeFileSync('.github/governance-result.json', `${JSON.stringify(result, null, 2)}\n`)
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/governance-result.json
          git commit -m 'chore(repo): record one-time governance result'
          git push origin HEAD:codex/ui-system-cleanup-v0.1.5

      - name: Preserve governance failure
        if: steps.governance.outcome != 'success'
        run: exit 1
