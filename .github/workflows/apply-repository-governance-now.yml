name: Apply Repository Governance Now

on:
  push:
    branches:
      - agent/apply-governance-now

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v7
        with:
          ref: agent/apply-governance-now

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate governance declaration
        run: node scripts/apply-repository-governance.mjs --dry-run

      - name: Apply repository security and branch governance
        env:
          REPOSITORY_ADMIN_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${REPOSITORY_ADMIN_TOKEN}" ]]; then
            echo 'REPOSITORY_ADMIN_TOKEN is not configured.' >&2
            exit 1
          fi
          node scripts/apply-repository-governance.mjs --repository "${GITHUB_REPOSITORY}"
