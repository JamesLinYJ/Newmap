version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 10
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /apps/worker
    schedule:
      interval: weekly
      day: monday
      time: '03:20'
      timezone: Asia/Singapore
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:40'
      timezone: Asia/Singapore
    open-pull-requests-limit: 10
